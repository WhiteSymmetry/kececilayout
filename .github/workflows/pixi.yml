# .github/workflows/pixi.yml
name: Pixi-Release

on:
  push:
    tags:
      - "v*"
  # Elle tetiklemek için — Actions sekmesinden "Run workflow" butonu çıkar
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (build et ama prefix.dev'e yükleme)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

permissions:
  contents: write  # Lock dosyası güncellenirse push edebilmek için

jobs:
  # ────────────────────────────────────────────────────────────
  # JOB: Derleme ve prefix.dev Kanalına Yükleme (GitHub Kaynaklı)
  # ────────────────────────────────────────────────────────────
  build-and-publish:
    name: Build & Publish conda package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0   # Tam git geçmişi (gerekirse lock commit için)

      - name: Setup pixi
        uses: prefix-dev/setup-pixi@v0.10.2
        with:
          pixi-version: v0.81.0
          cache: false
          auth-host: prefix.dev
          auth-token: ${{ secrets.PIXI_TOKEN }}
          frozen: false      # Lock dosyası yoksa veya eskiyse yeniden çöz
          locked: false      # Lock dosyasını zorunlu tutma

      - name: Update lock file (Değişmişse otomatik commit'le)
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet pixi.lock; then
            git add pixi.lock
            git commit -m "chore: update pixi.lock [skip ci]"
            git push
          else
            echo "pixi.lock değişmedi."
          fi

      - name: Update recipe version & sha256 (GitHub Direct Download)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # PyPI bağımlılığını kırmak için doğrudan mevcut GitHub tag arşivi (.tar.gz) indirilir ve SHA256'sı hesaplanır
          GITHUB_URL="https://github.com{{ github.repository }}/archive/refs/tags/${GITHUB_REF_NAME}.tar.gz"
          SHA256=$(curl -sL "$GITHUB_URL" | sha256sum | cut -d' ' -f1)
          
          # recipe.yaml güncellemeleri
          sed -i "s/^version: .*/version: \"${VERSION}\"/" recipe.yaml
          sed -i "s/^sha256: .*/sha256: ${SHA256}/" recipe.yaml
          
          # Eğer recipe.yaml içinde kaynak URL tanımı varsa onu da GitHub arşivi yapacak şekilde günceller:
          sed -i "s|url: .*|url: ${GITHUB_URL}|" recipe.yaml || echo "URL alanı bulunamadı veya güncellenmedi."
          
          echo "Version: $VERSION, SHA256: $SHA256, URL: $GITHUB_URL"

      - name: Build conda package
        uses: prefix-dev/rattler-build-action@v0.2.39
        with:
          recipe-path: recipe.yaml    # Ana dizin
          build-args: >-
            --target-platform linux-64
            -c conda-forge
            -c https://prefix.dev/conda-forge
          upload-artifact: true
          artifact-name: conda-package-linux-64

      - name: Upload to prefix.dev
        if: ${{ github.event.inputs.dry_run != 'true' }}
        shell: bash
        env:
          PIXI_TOKEN: ${{ secrets.PIXI_TOKEN }}
        run: |
          for pkg in $(find output -type f \( -name "*.conda" -o -name "*.tar.bz2" \)); do
            echo "Uploading: $pkg"
            rattler-build upload prefix \
              --channel bilgi/kececilayout \
              --api-key "$PIXI_TOKEN" \
              "$pkg" || echo "Warning: duplicate, skipping"
          done

      - name: Dry run info
        if: ${{ github.event.inputs.dry_run == 'true' }}
        run: |
          echo "=== DRY RUN — yükleme yapılmadı ==="
          find output -type f \( -name "*.conda" -o -name "*.tar.bz2" \)
