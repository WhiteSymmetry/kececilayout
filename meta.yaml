
package:
  name: kececilayout
  version: "0.7.2"

source:
  url: https://files.pythonhosted.org/packages/09/30/535b1ddf94a11d1a5ea9c4f8c5011e0d48fa6c1ec88e458a2683d9f543f4/kececilayout-0.7.2.tar.gz
  blake2b-256: 0930535b1ddf94a11d1a5ea9c4f8c5011e0d48fa6c1ec88e458a2683d9f543f4
  
build:
  noarch: python
  script: {{ PYTHON }} -m pip install . --no-deps --ignore-installed
  number: 0

requirements:
  host:
    - python >=3.11
    - pip
    - setuptools
    - numpy
  run:
    # Bu, paketin çalışması için GEREKLİ olan CONDA bağımlılıklarıdır: networkit 3.14 conda kurulumunda sorun çıkartıyor
    - python >=3.11
    - numpy
    - networkx
    - matplotlib
    - matplotlib-base
    - pycairo
    - cairocffi
    - cairo
    - python-igraph
    - rustworkx
    - python-louvain
    - graph-tool
    - numba
    - qiskit
    - scipy
    - pandas
    - chess
  build:
    - python >=3.11
    - pip
    - setuptools
    - numpy
    - matplotlib
    - scipy

test:
  requires:
    - matplotlib
    - scipy
    - numpy
  imports:
    - numpy
    - networkx
    - matplotlib
    - matplotlib-base
    - pycairo
    - cairocffi
    - cairo
    - python-igraph
    - rustworkx
    - networkit
    - python-louvain
    - graph-tool
    - numba
    - qiskit
    - scipy
    - pandas
    - chess
    - seaborn
    - igraph

# DİKKAT: 'test:' bölümü bilinçli olarak kaldırılmıştır.

about:
  home: https://github.com/WhiteSymmetry/kececilayout
  license: AGPL3.0-or-later
  license_file: LICENSE
  summary: Advanced sequential-zigzag graph layout algorithm
  description: |
    A deterministic node placement algorithm for graph visualization that arranges
    nodes sequentially along a primary axis with alternating offsets.
  doc_url: https://github.com/WhiteSymmetry/kececilayout
